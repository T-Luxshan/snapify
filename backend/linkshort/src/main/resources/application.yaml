spring:
  application:
    name: linkshort

  datasource:
    url: jdbc:mysql://localhost:3306/linkshort?allowPublicKeyRetrieval=true&useSSL=false
    username: linkshort
    password: linkshort

  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    show-sql: false

  flyway:
    enabled: false

  data:
    redis:
      host: localhost
      port: 6379

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: always

app:
  base-url: http://localhost:8080