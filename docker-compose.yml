services:
  mysql:
    image: mysql:8
    container_name: snapify-mysql
    ports:
      - "3306:3306"
    environment:
      MYSQL_DATABASE: snapify
      MYSQL_USER: snapify
      MYSQL_PASSWORD: snapify
      MYSQL_ROOT_PASSWORD: root
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-usnapify", "-psnapify"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    container_name: snapify-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  mysql_data: